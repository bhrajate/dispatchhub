syntax = "proto3";

package dispatch.v1;

option go_package = "github.com/dispatchhub/dispatchhub/api/proto;dispatchpb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// DispatchService is the main API for task management.
service DispatchService {
  // Task operations
  rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);

  // Queue operations
  rpc GetQueueStats(GetQueueStatsRequest) returns (GetQueueStatsResponse);
}

// --- Task messages ---

message TaskSpec {
  string name = 1;
  string namespace = 2;
  string group = 3;
  string type = 4;
  bytes payload = 5;
  map<string, string> labels = 6;
  TaskPriority priority = 7;
  google.protobuf.Duration delay = 8;
  google.protobuf.Timestamp schedule_at = 9;
  google.protobuf.Duration timeout = 10;
  int32 max_retries = 11;
  google.protobuf.Duration retry_backoff = 12;
  string queue_name = 13;
}

enum TaskPriority {
  TASK_PRIORITY_UNSPECIFIED = 0;
  TASK_PRIORITY_LOW = 1;
  TASK_PRIORITY_DEFAULT = 5;
  TASK_PRIORITY_HIGH = 8;
  TASK_PRIORITY_CRITICAL = 10;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PENDING = 1;
  TASK_STATE_SCHEDULED = 2;
  TASK_STATE_RUNNING = 3;
  TASK_STATE_RETRYING = 4;
  TASK_STATE_COMPLETED = 5;
  TASK_STATE_FAILED = 6;
  TASK_STATE_CANCELLED = 7;
  TASK_STATE_TIMEOUT = 8;
}

message Task {
  string id = 1;
  TaskSpec spec = 2;
  TaskState state = 3;
  string result = 4;
  string error = 5;
  string worker_id = 6;
  int32 retry_count = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp finished_at = 10;
  int64 version = 11;
}

message SubmitTaskRequest {
  TaskSpec spec = 1;
}

message SubmitTaskResponse {
  string task_id = 1;
  Task task = 2;
}

message GetTaskRequest {
  string task_id = 1;
}

message GetTaskResponse {
  Task task = 1;
}

message ListTasksRequest {
  string namespace = 1;
  string group = 2;
  string type = 3;
  TaskState state = 4;
  map<string, string> labels = 5;
  string queue_name = 6;
  int32 limit = 7;
  int32 offset = 8;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  int64 total = 2;
}

message CancelTaskRequest {
  string task_id = 1;
}

message CancelTaskResponse {
  Task task = 1;
}

// --- Queue messages ---

message GetQueueStatsRequest {
  string queue_name = 1;
}

message GetQueueStatsResponse {
  string queue_name = 1;
  int64 pending = 2;
  int64 active = 3;
  int64 scheduled = 4;
  int64 retrying = 5;
  int64 completed = 6;
  int64 failed = 7;
}
