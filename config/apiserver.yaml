server:
  grpc_addr: ":9090"
  http_addr: ":8080"

etcd:
  endpoints:
    - localhost:2379
  dial_timeout: 5s

redis:
  addr: localhost:6379
  pool_size: 100
  min_idle_conns: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

mysql:
  dsn: "root:@tcp(localhost:3306)/dispatchhub?charset=utf8mb4&parseTime=true&loc=Local"
  # 连接池设置为 idle == open，避免突发负载下 database/sql 连接频繁创建和关闭。
  # ConnMaxIdleTime 应小于服务端 wait_timeout（MySQL 8 默认 28800s），
  # 使客户端先于 MySQL 主动关闭 idle connection。
  max_open_conns: 50
  max_idle_conns: 50
  conn_max_lifetime: 1h
  conn_max_idle_time: 5m

metrics:
  enabled: true
  addr: ":9091"
  path: "/metrics"

log:
  level: info
  format: json
  output: stdout

# SubmitTask 使用按队列划分的 token-bucket limiter。设置 enabled=false
# 或 default_rate=0 可完全禁用。按队列覆盖项为可选配置。
rate_limit:
  enabled: true
  default_rate: 1000
  default_burst: 1000
  # per_queue:
  #   high-priority: { rate: 5000, burst: 5000 }
