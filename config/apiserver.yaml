server:
  grpc_addr: ":9090"
  http_addr: ":8080"

etcd:
  endpoints:
    - localhost:2379
  dial_timeout: 5s

redis:
  addr: localhost:6379
  pool_size: 100
  min_idle_conns: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

mysql:
  dsn: "root:@tcp(localhost:3306)/dispatchhub?charset=utf8mb4&parseTime=true&loc=Local"
  # Pool sized so idle == open to avoid database/sql connection churn under
  # bursty load. ConnMaxIdleTime should be < server-side wait_timeout (default
  # 28800s on MySQL 8) so the client closes idle conns before MySQL drops them.
  max_open_conns: 50
  max_idle_conns: 50
  conn_max_lifetime: 1h
  conn_max_idle_time: 5m

metrics:
  enabled: true
  addr: ":9091"
  path: "/metrics"

log:
  level: info
  format: json
  output: stdout

# Per-queue token-bucket limiter applied at SubmitTask. Set enabled=false (or
# default_rate=0) to disable entirely. Per-queue overrides are optional.
rate_limit:
  enabled: true
  default_rate: 1000
  default_burst: 1000
  # per_queue:
  #   high-priority: { rate: 5000, burst: 5000 }
