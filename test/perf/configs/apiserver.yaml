server:
  grpc_addr: ":9090"
  http_addr: ":8080"

etcd:
  endpoints:
    - localhost:22379
  dial_timeout: 5s

redis:
  addr: localhost:16380
  pool_size: 100
  min_idle_conns: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

mysql:
  dsn: "root:@tcp(localhost:33307)/dispatchhub?charset=utf8mb4&parseTime=true&loc=Local"
  # Pool sized so idle == open: avoids the database/sql connection churn that
  # surfaced as "driver: bad connection" at 300 RPS in r1, where idle conns
  # above max_idle_conns were closed and rebuilt under load.
  max_open_conns: 50
  max_idle_conns: 50
  conn_max_lifetime: 1h
  conn_max_idle_time: 5m

metrics:
  enabled: true
  addr: ":9091"
  path: "/metrics"

log:
  level: info
  format: json
  output: stdout

# Bench config: rate limiter disabled to measure raw service ceiling.
rate_limit:
  enabled: false
  default_rate: 1000
  default_burst: 1000
