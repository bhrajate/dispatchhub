server:
  grpc_addr: ":9090"
  http_addr: ":8080"

etcd:
  endpoints:
    - localhost:22379
  dial_timeout: 5s

redis:
  addr: localhost:16380
  pool_size: 100
  min_idle_conns: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

mysql:
  dsn: "root:@tcp(localhost:33307)/dispatchhub?charset=utf8mb4&parseTime=true&loc=Local"
  # 连接池设置为 idle == open：避免 r1 中 300 RPS 下暴露的 database/sql 连接抖动，
  # 当时超过 max_idle_conns 的 idle connection 会在负载下关闭并重建，
  # 进而出现 "driver: bad connection"。
  max_open_conns: 50
  max_idle_conns: 50
  conn_max_lifetime: 1h
  conn_max_idle_time: 5m

metrics:
  enabled: true
  addr: ":9091"
  path: "/metrics"

log:
  level: info
  format: json
  output: stdout

# Benchmark 配置：禁用 rate limiter，用于测量服务原始上限。
rate_limit:
  enabled: false
  default_rate: 1000
  default_burst: 1000
