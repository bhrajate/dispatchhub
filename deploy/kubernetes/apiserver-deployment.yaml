apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatchhub-apiserver
  namespace: dispatchhub
  labels:
    app.kubernetes.io/name: dispatchhub
    app.kubernetes.io/component: apiserver
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatchhub
      app.kubernetes.io/component: apiserver
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatchhub
        app.kubernetes.io/component: apiserver
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: dispatchhub
      terminationGracePeriodSeconds: 30
      containers:
        - name: apiserver
          image: dispatchhub/apiserver:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/dispatchhub/apiserver.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/dispatchhub
              readOnly: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
      volumes:
        - name: config
          configMap:
            name: dispatchhub-apiserver-config
---
apiVersion: v1
kind: Service
metadata:
  name: dispatchhub-apiserver
  namespace: dispatchhub
  labels:
    app.kubernetes.io/name: dispatchhub
    app.kubernetes.io/component: apiserver
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
  selector:
    app.kubernetes.io/name: dispatchhub
    app.kubernetes.io/component: apiserver
