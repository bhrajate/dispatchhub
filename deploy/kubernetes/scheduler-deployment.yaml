apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatchhub-scheduler
  namespace: dispatchhub
  labels:
    app.kubernetes.io/name: dispatchhub
    app.kubernetes.io/component: scheduler
spec:
  # Multiple replicas for HA — leader election ensures only one is active
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatchhub
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatchhub
        app.kubernetes.io/component: scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: dispatchhub
      terminationGracePeriodSeconds: 30
      containers:
        - name: scheduler
          image: dispatchhub/scheduler:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/dispatchhub/config.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/dispatchhub
              readOnly: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      volumes:
        - name: config
          configMap:
            name: dispatchhub-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - scheduler
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: dispatchhub-scheduler
  namespace: dispatchhub
  labels:
    app.kubernetes.io/name: dispatchhub
    app.kubernetes.io/component: scheduler
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: dispatchhub
    app.kubernetes.io/component: scheduler
