{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dispatchhub.name" . }}-scheduler
  labels:
    {{- include "dispatchhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicas }}
  selector:
    matchLabels:
      {{- include "dispatchhub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "dispatchhub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      serviceAccountName: {{ include "dispatchhub.name" . }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: scheduler
          image: "{{ .Values.scheduler.image.repository }}:{{ .Values.scheduler.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args: ["--config=/etc/dispatchhub/scheduler.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.scheduler.service.httpPort }}
            - name: metrics
              containerPort: 9091
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/dispatchhub
      volumes:
        - name: config
          configMap:
            name: {{ include "dispatchhub.name" . }}-scheduler-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: scheduler
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dispatchhub.name" . }}-scheduler
  labels:
    {{- include "dispatchhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  type: {{ .Values.scheduler.service.type }}
  ports:
    - name: http
      port: {{ .Values.scheduler.service.httpPort }}
      targetPort: http
  selector:
    {{- include "dispatchhub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
{{- end }}
