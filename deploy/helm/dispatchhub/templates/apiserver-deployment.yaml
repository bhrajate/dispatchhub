{{- if .Values.apiserver.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dispatchhub.name" . }}-apiserver
  labels:
    {{- include "dispatchhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  replicas: {{ .Values.apiserver.replicas }}
  selector:
    matchLabels:
      {{- include "dispatchhub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: apiserver
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "dispatchhub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: apiserver
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      serviceAccountName: {{ include "dispatchhub.name" . }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: apiserver
          image: "{{ .Values.apiserver.image.repository }}:{{ .Values.apiserver.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args: ["--config=/etc/dispatchhub/apiserver.yaml"]
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9091
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.apiserver.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/dispatchhub
      volumes:
        - name: config
          configMap:
            name: {{ include "dispatchhub.name" . }}-apiserver-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dispatchhub.name" . }}-apiserver
  labels:
    {{- include "dispatchhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
  selector:
    {{- include "dispatchhub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
{{- if .Values.apiserver.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dispatchhub.name" . }}-apiserver
  labels:
    {{- include "dispatchhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  ingressClassName: {{ .Values.apiserver.ingress.className }}
  {{- if .Values.apiserver.ingress.tls }}
  tls:
    {{- toYaml .Values.apiserver.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.apiserver.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "dispatchhub.name" $ }}-apiserver
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
